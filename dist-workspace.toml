[workspace]
members = ["cargo:."]

# How releases are built and shipped (#37). After changing this file, run
# `dist generate` (dist 0.32.0) to regenerate .github/workflows/release.yml.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# A release is `gh workflow run release.yml -f tag=vX.Y.Z`, and the GitHub
# Release it creates makes the tag. The default tag, `dry-run`, builds,
# checks and signs everything and publishes nothing.
dispatch-releases = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
installers = ["shell", "powershell", "homebrew"]
install-path = "~/.local/bin"
tap = "yuann3/homebrew-tap"
# docs deploys the docs site, with this release at / (#72).
publish-jobs = ["homebrew", "./release-crates", "./docs"]
auto-includes = false
# THIRD_PARTY_NOTICES.md is written by .github/build-setup.yml.
include = ["README.md", "LICENSE-MIT", "LICENSE-APACHE", "THIRD_PARTY_NOTICES.md"]
github-build-setup = "../build-setup.yml"
# Before the GitHub Release is made: every check CI runs passes (#37),
# each binary runs on its own platform, and sha256.txt is signed. Not
# plan-jobs: when one of those fails, dist skips the builds, and a skipped
# build lets `host` make the release.
global-artifacts-jobs = ["./ci", "./release-smoke", "./release-sign"]
github-custom-job-permissions = { "release-crates" = { contents = "read" }, "docs" = { contents = "read" } }
# GitHub attaches the source to every release already.
source-tarball = false
# Made only for a real release, so a dry run leaves no record.
github-attestations = true
github-attestations-phase = "host"
github-release = "host"

# Linux binaries are static musl, built with cargo-zigbuild, which dist
# uses only to cross-compile; so each is built on the other architecture.
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-unknown-linux-musl = "ubuntu-24.04"
x86_64-apple-darwin = "macos-15-intel"
aarch64-apple-darwin = "macos-15"
x86_64-pc-windows-msvc = "windows-2022"
aarch64-pc-windows-msvc = "windows-2022"

# rav1e's x86_64 assembly (#27).
[dist.dependencies.apt]
nasm = { targets = ["x86_64-unknown-linux-musl"] }

[dist.dependencies.homebrew]
nasm = { targets = ["x86_64-apple-darwin"] }

[dist.dependencies.chocolatey]
nasm = { targets = ["x86_64-pc-windows-msvc"] }

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
