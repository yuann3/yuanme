[site]
url = "https://e.com"

[collections.posts]
route = "/blog/{slug}/"

[routes.home]
path = "/"
template = "home.html"

[routes.missing]
path = "/404.html"
template = "404.html"

[feeds.rss]
collections = ["posts"]
path = "/rss.xml"

# A Page here loads one of every kind of asset: more files than the
# Starters' 4 requests.
[budgets]
requests = 6
