[site]
url = "https://e.com"

[router]
mode = "swap"

[collections.posts]
route = "/posts/{slug}/"

[routes.home]
path = "/"
template = "home.html"

[routes.about]
path = "/about/"
template = "about.html"

[routes.projects]
path = "/projects/"
template = "projects.html"

[routes.missing]
path = "/404.html"
template = "404.html"

# Its Pages load a stylesheet, Scripts and Sidecar scripts for the feel
# checks, and in "swap" mode the Router's Script and chunk: more than the
# Starters' 4 requests.
[budgets]
requests = 7
