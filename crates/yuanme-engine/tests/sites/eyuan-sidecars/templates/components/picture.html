{# Stands in for Astro's <Picture>: a child component, so its elements belong to this file, not the caller. #}
{# props: photo: object, sizes: string #}
{% macro picture(photo, sizes) %}
<picture>
  <source type="image/avif" srcset="{{ photo.src }}-160.avif 160w, {{ photo.src }}-320.avif 320w" sizes="{{ sizes }}">
  <source type="image/webp" srcset="{{ photo.src }}-160.webp 160w, {{ photo.src }}-320.webp 320w" sizes="{{ sizes }}">
  <img src="{{ photo.src }}.jpg" srcset="{{ photo.src }}-160.jpg 160w, {{ photo.src }}-320.jpg 320w" sizes="{{ sizes }}" alt="{{ photo.alt }}" loading="lazy" decoding="async" draggable="false" width="{{ photo.w }}" height="{{ photo.h }}">
</picture>
{% endmacro %}
