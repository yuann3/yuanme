[package]
name = "yuanme-engine"
description = "The yuanme build pipeline. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
yuanme-content.workspace = true
yuanme-render.workspace = true
yuanme-assets.workspace = true
yuanme-diag.workspace = true
blake3 = "1.8.7"
rayon = "1.12.0"

[features]
default = ["asm"]
asm = ["yuanme-assets/asm"]

[dev-dependencies]
tempfile = "3.27.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
