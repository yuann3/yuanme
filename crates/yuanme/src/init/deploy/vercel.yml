# Builds the Site and deploys it to Vercel: a push to main deploys it to
# production, and a pull request deploys a preview. Without the
# VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets it only builds.
# Written by `yuanme init`; it is yours to change.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YUANME_VERSION: "@VERSION@"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
@BUILD@
      - name: Look for the deploy secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets, so the Site is built but not deployed."
          fi
      # `yuanme build` wrote .vercel/output/ in the Build Output API's form.
      - name: Deploy
        if: steps.secrets.outputs.found == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            npx --yes vercel@65 deploy --prebuilt --prod --token "$VERCEL_TOKEN"
          else
            url=$(npx --yes vercel@65 deploy --prebuilt --token "$VERCEL_TOKEN")
            echo "Preview at $url" >> "$GITHUB_STEP_SUMMARY"
          fi
