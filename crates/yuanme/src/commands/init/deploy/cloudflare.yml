# Builds the Site and deploys it to Cloudflare Workers: a push to main
# deploys it, and a pull request uploads a preview version. Without the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets it only builds.
# Written by `yuanme init`; it is yours to change.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YUANME_VERSION: "@VERSION@"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
@BUILD@
      - name: Look for the deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, so the Site is built but not deployed."
          fi
      - name: Deploy
        if: steps.secrets.outputs.found == 'true' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Upload a preview
        id: preview
        if: steps.secrets.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
      - if: steps.preview.outputs.deployment-url != ''
        env:
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: echo "Preview at $URL" >> "$GITHUB_STEP_SUMMARY"
