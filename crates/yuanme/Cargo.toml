[package]
name = "yuanme"
description = "A Rust static site generator for Markdown, Org and math, built to be driven by coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The Homebrew formula's; the docs site's once it exists.
homepage = "https://github.com/yuann3/yuanme"
include = ["/src", "/build.rs"]

# `cargo binstall yuanme` takes the release's archive (#37). dist's tarballs
# hold one folder; its zips hold the files.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
yuanme-engine.workspace = true
yuanme-content.workspace = true
yuanme-diag.workspace = true
yuanme-render.workspace = true
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
rayon = "1.12.0"
ignore = "0.4.33"
serde_json = "1.0.154"
# `yuanme dev` (#11, #24): the only part of yuanme that runs tokio.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync", "signal"] }
notify = "8.2.0"
# musl's allocator is slow under rayon's threads, and the Linux release is
# musl (#37).
mimalloc = "0.1.52"

[features]
default = ["asm"]
# rav1e's assembly. Without it no nasm is needed, and AVIF encodes about
# 1.7× slower (#27).
asm = ["yuanme-engine/asm"]

[dev-dependencies]
tempfile = "3.27.0"
insta = "1.49.0"
jsonschema = { version = "0.60.1", default-features = false }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
