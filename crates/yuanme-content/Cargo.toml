[package]
name = "yuanme-content"
description = "Site config and content for yuanme: Entries, the Document tree, math and links. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
serde_json = "1.0.154"
strsim = "0.11.1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
yuanme-diag.workspace = true

[dev-dependencies]
insta = "1.49.0"
