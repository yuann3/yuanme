[package]
name = "yuanme-content"
description = "Site config and content for yuanme: Entries, the Document tree, math and links. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
# comrak 0.57.0 with parse_document_bounded and the slow-path fixes that
# hold #15's parse-time bound (#47).
comrak = { workspace = true, features = ["attributes"] }
# math-core 0.9.0 with each snippet's labels and a bound on nesting (#50).
math-core.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "serde"] }
rayon = "1.12.0"
saphyr-parser = "0.2"
# A parsed Entry is cached on disk (ADR 0011).
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
strsim = "0.11.1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
unicode-normalization = "0.1.26"
yuanme-diag.workspace = true
yuanme-org.workspace = true

[dev-dependencies]
insta = "1.49.0"
jsonschema = { version = "0.60.1", default-features = false }
