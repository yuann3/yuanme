[package]
name = "yuanme-assets"
description = "CSS, JS, images and fonts for yuanme. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
yuanme-diag.workspace = true
rayon = "1.12.0"
# Exact pins: their output is the Site's bytes, so a bump is an output
# change, reviewed as one (#27).
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
fast_image_resize = "=6.1.0"
# The version `image` uses, so there is one copy.
moxcms = "=0.8.1"
# ravif 0.13.0 with `Encoder::with_tiles`, so AVIF bytes don't depend on
# the core count (#28).
ravif = { workspace = true, features = ["threading"] }
mozjpeg-rs = "=0.9.2"
libwebp-sys = "=0.14.4"

[features]
default = ["asm"]
# rav1e's assembly: about 1.7× faster AVIF, and nasm on x86_64 (#27).
asm = ["ravif/asm"]

[dev-dependencies]
blake3 = "1.8.7"
insta = "1.49.0"
