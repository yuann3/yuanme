[package]
name = "yuanme-assets"
description = "CSS, JS, images and fonts for yuanme. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
yuanme-diag.workspace = true
rayon = "1.12.0"
# Exact pins: their output is the Site's bytes, so a bump is an output
# change, reviewed as one (#27).
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
fast_image_resize = "=6.1.0"
# The version `image` uses, so there is one copy.
moxcms = "=0.8.1"
# ravif 0.13.0 with `Encoder::with_tiles`, so AVIF bytes don't depend on
# the core count (#28).
ravif = { workspace = true, features = ["threading"] }
mozjpeg-rs = "=0.9.2"
libwebp-sys = "=0.14.4"
# MPL-2.0, used unmodified (ADR 0014).
lightningcss = { version = "=1.0.0-alpha.72", default-features = false, features = ["bundler"] }
# One family, bumped together: rolldown's own crates and oxc float under
# its `^` requirements, so the lockfile is what holds them (#27).
rolldown = "=1.2.15"
rolldown_common = "=1.2.15"
rolldown_error = "=1.2.15"
rolldown_utils = "=1.2.15"
# rolldown 1.2.15's.
oxc_resolver = "=11.24.3"
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
# rolldown runs on it; one current-thread runtime per build.
tokio = { version = "1.52.3", features = ["rt"] }
elsa = "1.11.2"
# Checks Managed tool downloads (ADR 0003). The version ferriki uses.
sha2 = "0.10.9"
# The math font's subset (#29). Exact, as their output is the Site's bytes.
read-fonts = "=0.46.0"
write-fonts = { version = "=0.55.0", features = ["read"] }
skera = "=0.9.0"
# Its default zlib backend is C.
allsorts = { version = "=0.17.0", default-features = false, features = ["flate2_rust"] }
ttf2woff2 = { version = "=0.14.1", default-features = false }

[features]
default = ["asm"]
# rav1e's assembly: about 1.7× faster AVIF, and nasm on x86_64 (#27).
asm = ["ravif/asm"]

[dev-dependencies]
blake3 = "1.8.7"
insta = "1.49.0"
tempfile = "3.27.0"
# skera 0.9.0's, to draw the subset's glyphs.
skrifa = "=0.49.0"
