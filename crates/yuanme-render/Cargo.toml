[package]
name = "yuanme-render"
description = "HTML writing, highlighting and Templates for yuanme. Internal; no stability promise."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
include = ["/src"]

[dependencies]
yuanme-content.workspace = true
yuanme-diag.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
# Exact: `unstable_machinery` has no stability promise (#19).
minijinja = { version = "=3.0.1", features = ["loop_controls", "unstable_machinery"] }
rayon = "1.12.0"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
insta = "1.49.0"
