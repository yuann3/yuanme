{# props: title: string, description: string, image?: string, article_date?: date #}
{% macro base_head(title, description, image="/blog-placeholder-1.jpg", article_date=none) %}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="/styles/global.css" />
<link rel="canonical" href="{{ page.canonical }}" />
<title>{{ title }} | {{ site.title }}</title>
<meta name="title" content="{{ title }}" />
<meta name="description" content="{{ description }}" />
<meta name="author" content="{{ site.author }}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{ page.canonical }}" />
<meta property="og:title" content="{{ title }}" />
<meta property="og:description" content="{{ description }}" />
<meta property="og:image" content="{{ absolute_url(image) }}" />
{% if article_date %}
<meta property="article:author" content="{{ site.author }}" />
<meta property="article:published_time" content="{{ article_date|dateformat(format="%Y-%m-%d") }}" />
{% endif %}
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:title" content="{{ title }}" />
<meta property="twitter:image" content="{{ absolute_url(image) }}" />
{% endmacro %}
