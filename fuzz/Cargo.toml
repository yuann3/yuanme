[package]
name = "yuanme-markdown-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
comrak = { package = "yuanme-comrak", path = "../vendor/comrak", features = ["attributes"] }
libfuzzer-sys = "0.4"
yuanme-content = { path = "../crates/yuanme-content" }
yuanme-diag = { path = "../crates/yuanme-diag" }
yuanme-render = { path = "../crates/yuanme-render" }

# Its own workspace, so the main one, its lockfile and its checks never see
# libFuzzer.
[workspace]

[[bin]]
name = "adversarial"
path = "fuzz_targets/adversarial.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytes"
path = "fuzz_targets/bytes.rs"
test = false
doc = false
bench = false
