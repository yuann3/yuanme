[workspace]
resolver = "3"
members = ["crates/*", "vendor/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# N−2 stable (#27). The build itself uses the exact release in rust-toolchain.toml.
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuann3/yuanme"

[workspace.dependencies]
yuanme-engine = { path = "crates/yuanme-engine", version = "0.0.0", default-features = false }
yuanme-content = { path = "crates/yuanme-content", version = "0.0.0" }
yuanme-render = { path = "crates/yuanme-render", version = "0.0.0" }
yuanme-assets = { path = "crates/yuanme-assets", version = "0.0.0", default-features = false }
yuanme-diag = { path = "crates/yuanme-diag", version = "0.0.0" }
yuanme-org = { path = "vendor/organic", version = "0.0.0" }
# Forks the published crates need, vendored because `[patch]` doesn't reach
# `cargo install` (#27). Each one's manifest says where its fork is.
ravif = { package = "yuanme-ravif", path = "vendor/ravif", version = "0.0.0" }

# The image pipeline's tests encode real photos, which takes minutes
# unoptimised. At release's opt-level, they hash release's bytes.
[profile.dev.package]
fast_image_resize.opt-level = 3
image.opt-level = 3
image-webp.opt-level = 3
libwebp-sys.opt-level = 3
moxcms.opt-level = 3
mozjpeg-rs.opt-level = 3
png.opt-level = 3
rav1e.opt-level = 3
yuanme-ravif.opt-level = 3
zune-jpeg.opt-level = 3
yuanme-assets.opt-level = 3

# parse_document_bounded and the slow-path fixes that hold #15's parse-time
# bound (#47), at a pinned commit on comrak 0.57.0. Rebase the branch onto
# each comrak release before bumping the pin in yuanme-content.
[patch.crates-io]
comrak = { git = "https://github.com/yuann3/comrak", rev = "5c14241418654c10b6a5129ee535b5831c231d9b" }
