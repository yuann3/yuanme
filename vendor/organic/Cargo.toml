[package]
name = "yuanme-org"
description = "The Org parser for yuanme, forked from organic. Internal; no stability promise."
version.workspace = true
# organic is 2021-edition code; moving it to 2024 is churn with no gain.
edition = "2021"
rust-version.workspace = true
license = "0BSD"
repository.workspace = true
include = ["/src", "/LICENSE"]
readme = false

[dependencies]
nom = "7.1.3"

[dev-dependencies]
insta = "1"
