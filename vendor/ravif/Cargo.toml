[package]
name = "yuanme-ravif"
description = "The AVIF encoder for yuanme, forked from ravif 0.13.0 for Encoder::with_tiles. Internal; no stability promise."
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "BSD-3-Clause"
repository.workspace = true
include = ["/src", "/LICENSE"]
readme = false

# Everything here but this file and rustfmt.toml is yuann3/cavif-rs's
# ravif/ at `rev`.
# `cargo xtask vendor-check` fails if the two differ (#28). Once
# kornelski/cavif-rs#114 is released, this crate goes and ravif comes back.
[package.metadata.fork]
repository = "https://github.com/yuann3/cavif-rs"
rev = "80886cdf01620d7c934bd18ade6e54744ebe366e"
dir = "ravif"
own = ["rustfmt.toml"]

[lib]
name = "ravif"
# ravif's tests live in the fork; yuanme's image tests cover what it uses.
test = false
doctest = false
bench = false

[dependencies]
avif-serialize = "0.8.6"
imgref = "1.12.0"
loop9 = "0.1.5"
quick-error = "2.0.1"
rav1e = { version = "0.8.1", default-features = false }
rayon = { version = "1.11.0", optional = true }
rgb = { version = "0.8.52", default-features = false }

[features]
asm = ["rav1e/asm"]
threading = ["dep:rayon", "rav1e/threading"]

[lints.clippy]
# ravif's own style, which yuanme doesn't change.
all = { level = "allow", priority = -1 }
