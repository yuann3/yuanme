{% from "components/picture.html" import picture %}

{# props: photos: list<object> #}
{% macro photo_pile(photos) %}
{% set sizes = {"portrait": "(min-width: 1100px) 220px, 160px", "tall": "(min-width: 1100px) 190px, 130px", "landscape": "(min-width: 1100px) 260px, 280px"} %}
<div class="about-body">
  {{ caller() }}
  <div class="pile" data-pile>
    <div class="pile-stage" data-pile-stage>
      {% for p in photos %}
      {% set ar = p.w / p.h %}
      {% set kind = "landscape" if ar > 1 else ("tall" if ar < 0.7 else "portrait") %}
      <figure
        class="photo photo-{{ kind }}"
        data-photo
        style="--ar:{{ ar|round(4) }};--fx:{{ p.fx }};--fy:{{ p.fy }};--r:{{ p.r }}deg;--t:{{ p.t }}deg;--z:{{ loop.index }}"
      >
        {{ picture(photo=p, sizes=sizes[kind]) }}
        <figcaption>{{ p.caption }}</figcaption>
      </figure>
      {% endfor %}
    </div>
  </div>
</div>
{% endmacro %}
