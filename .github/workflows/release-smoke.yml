# Each release archive, on the platform it is for, before the GitHub Release
# is made (dist-workspace.toml's global-artifacts-jobs): its checksum, its
# files, and its binary building a Site.
name: Release smoke test

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  # #36's lab check of the Starters, made and built by this release's Linux
  # binary: mobile LCP ≤ 2.0 s and CLS ≤ 0.01 on each Starter's home Page
  # and the blog's Post, in Chromium on Lighthouse's mobile throttling.
  starters-lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-x86_64-unknown-linux-musl
          path: artifacts
      - run: mkdir unpacked && tar -xf artifacts/yuanme-x86_64-unknown-linux-musl.tar.xz -C unpacked --strip-components 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - working-directory: crates/yuanme/tests/starters
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node starters.ts --lab --yuanme ../../../../unpacked/yuanme

  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, archive: tar.xz }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, archive: tar.xz }
          - { target: x86_64-apple-darwin, runner: macos-15-intel, archive: tar.xz }
          - { target: aarch64-apple-darwin, runner: macos-15, archive: tar.xz }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, archive: zip }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, archive: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: yuanme-${{ matrix.target }}.${{ matrix.archive }}
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: artifacts
      - name: Checksum
        working-directory: artifacts
        run: |
          if command -v sha256sum > /dev/null; then sha256sum -c "$ARCHIVE.sha256"; else shasum -a 256 -c "$ARCHIVE.sha256"; fi
      - name: Unpack
        run: |
          mkdir unpacked
          if [ "${{ matrix.archive }}" = zip ]; then
            unzip -q "artifacts/$ARCHIVE" -d unpacked
          else
            tar -xf "artifacts/$ARCHIVE" -C unpacked --strip-components 1
          fi
          ls -l unpacked
      # #37's list, and nothing else.
      - name: Archive contents
        run: |
          exe=yuanme; [ "${{ matrix.archive }}" = zip ] && exe=yuanme.exe
          expected=$(printf '%s\n' LICENSE-APACHE LICENSE-MIT README.md THIRD_PARTY_NOTICES.md "$exe" | sort)
          actual=$(ls unpacked | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::$ARCHIVE has:"; echo "$actual"; exit 1
          fi
          grep -q 'Independent JPEG Group' unpacked/THIRD_PARTY_NOTICES.md
          grep -q 'yuanme-comrak' unpacked/THIRD_PARTY_NOTICES.md
          grep -q 'catppuccin' unpacked/THIRD_PARTY_NOTICES.md
      - name: Static binary
        if: runner.os == 'Linux'
        run: |
          file unpacked/yuanme
          file unpacked/yuanme | grep -Eq 'static(ally|-pie) linked'
      - name: Build a Site
        run: |
          # A release reports its version alone.
          [[ $PLAN =~ \"app_version\":\"([^\"]+)\" ]]
          unpacked/yuanme --version
          test "$(unpacked/yuanme --version)" = "yuanme ${BASH_REMATCH[1]}"
          cp -R crates/yuanme-engine/tests/sites/assets smoke-site
          unpacked/yuanme build -C smoke-site --strict
          test -f smoke-site/dist/index.html
      # The same on every platform (#28); the run's summary lists all six.
      - name: Site hash
        working-directory: smoke-site/dist
        run: |
          sum() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          find . -type f | LC_ALL=C sort | while read -r f; do echo "$(sum "$f" | cut -c1-64) $f"; done | tee "$RUNNER_TEMP/files.sha256"
          echo "${{ matrix.target }}: \`$(sum < "$RUNNER_TEMP/files.sha256" | cut -c1-64)\`" >> "$GITHUB_STEP_SUMMARY"
