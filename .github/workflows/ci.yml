name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release runs all of it before it publishes (dist-workspace.toml).
  workflow_call:
    inputs:
      # dist's release plan, which CI doesn't read.
      plan:
        type: string

permissions:
  contents: read

# Called by the release, github.workflow is the release's name, so a
# release and a push to the same branch don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rav1e's x86_64 assembly (#27).
      - run: sudo apt-get install -y nasm
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm
      # One snapshot of image hashes for both, so this is also the test that
      # x86_64 and arm64 encode the same bytes (#28).
      - run: cargo nextest run --locked --workspace

  # The tests that run the real Tailwind CLI (#59): it matches the
  # official --optimize, daisyui works from a Bun isolated install, and a
  # warm build runs no Tailwind. The Engine downloads the CLI and Bun
  # installs daisyui, so they are ignored in the test job, which stays off
  # the network.
  tailwind:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm
      - run: cargo nextest run --locked -p yuanme-engine -p yuanme --run-ignored only -E 'binary(=tailwind) or test(=a_warm_build_runs_no_tailwind)'

  # The tests that run the real tsc (#60): type errors are reported at
  # their spans, the types yuanme writes check, and an unchanged check runs
  # no tsc. The Engine downloads tsc, so they are ignored in the test job.
  typescript:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm
      - run: cargo nextest run --locked -p yuanme-engine -p yuanme --run-ignored only -E 'binary(=typescript) or test(=an_unchanged_check_runs_no_tsc)'

  # #15's Gate: image encoding takes at most 75 ms of wall time per output
  # on ubuntu-latest.
  image-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - run: sudo apt-get install -y nasm
      - run: cargo nextest run --release --locked -p yuanme-assets --run-ignored only --no-capture

  # The Router's feel checks (#61) on a fixture Site, in the three engines.
  # Its size, at most 2 KB br, is a test in the test job.
  router:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/yuanme-engine/tests/router
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get install -y nasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/yuanme-engine/tests/router/package-lock.json
      - run: cargo build --locked -p yuanme
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node feel.ts --yuanme ../../../../target/debug/yuanme

  # The Org parser's guarantees (#15): no input panics or fails except by
  # running out of fuel or nesting too deep, and none parses slower than
  # 1 ms/KB + 1 ms, scaled to the runner's speed. libFuzzer's
  # instrumentation slows parsing down, so the replay times the inputs found
  # again in a plain release build.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/organic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/organic/fuzz
      - run: cargo install --locked cargo-fuzz@0.13.2
      # The fuzz crate is its own workspace, so the lint job doesn't see it.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/adversarial fuzz/corpus/bytes
          cargo fuzz run --sanitizer none adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial -- -max_total_time=120 -timeout=10
          cargo fuzz run --sanitizer none bytes fuzz/corpus/bytes fuzz/seeds/bytes -- -max_total_time=60 -timeout=10
      - name: Replay against the parse-time bound
        run: |
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- bytes fuzz/corpus/bytes fuzz/seeds/bytes
      # The inputs this run found, so a failure can be reproduced.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: |
            vendor/organic/fuzz/corpus
            vendor/organic/fuzz/artifacts
          if-no-files-found: ignore

  # The same guarantees for a Markdown body (#15, #47): no input panics, and
  # none parses slower than 1 ms/KB + 1 ms, scaled to the runner's speed,
  # through all of markdown::document. The bytes target starts from the
  # Markdown corpus, and the margin check fails if a corpus file has less
  # than ten times the fuel it needs.
  fuzz-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo run --release --locked --manifest-path fuzz/Cargo.toml --example margin -- corpus/md
      # The adversarial seeds are full-size slow inputs for the replay;
      # libFuzzer mutates their first 4 KB, which the generator multiplies.
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/adversarial fuzz/corpus/bytes
          cargo fuzz run --sanitizer none adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial -- -max_total_time=120 -timeout=10 -max_len=4096
          cargo fuzz run --sanitizer none bytes fuzz/corpus/bytes corpus/md -- -max_total_time=60 -timeout=10
      - name: Replay against the parse-time bound
        run: |
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- bytes fuzz/corpus/bytes corpus/md
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-markdown-corpus
          path: |
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: ignore

  # The committed math font is the one math-font.py builds from its pinned
  # math-core-fonts commit (#52), with Ubuntu 24.04's FontForge.
  math-font:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y python3-fontforge
      # The system Python, which apt's fontforge module is for.
      - run: /usr/bin/python3 crates/yuanme-assets/math-font.py
      - run: git diff --exit-code --stat crates/yuanme-assets/src/font
      # What this run built, to commit if it is the right font.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: math-font
          path: crates/yuanme-assets/src/font

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny --locked check
      - run: cargo xtask vendor-check
      - name: deny.toml rejects a GPL crate
        run: |
          if cargo deny --manifest-path ci/deny-fixture/Cargo.toml --locked --config deny.toml check licenses 2> deny.out; then
            echo "::error::cargo-deny accepted ci/deny-fixture's GPL crate"; exit 1
          fi
          grep -q 'error\[rejected\]' deny.out || { cat deny.out; echo "::error::cargo-deny failed for another reason"; exit 1; }
      - run: cargo xtask package-check
      # What every release archive carries (#27), so a licence it can't
      # classify fails here and not at release.
      - run: cargo xtask notices
      - name: about.toml rejects a GPL crate
        run: |
          if cargo about generate --locked --config about.toml --manifest-path ci/deny-fixture/Cargo.toml about.hbs > /dev/null 2> about.out; then
            echo "::error::cargo-about accepted ci/deny-fixture's GPL crate"; exit 1
          fi
          grep -q 'failed to satisfy license requirements' about.out || { cat about.out; echo "::error::cargo-about failed for another reason"; exit 1; }
