name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rav1e's x86_64 assembly (#27).
      - run: sudo apt-get install -y nasm
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y nasm
      # One snapshot of image hashes for both, so this is also the test that
      # x86_64 and arm64 encode the same bytes (#28).
      - run: cargo nextest run --locked --workspace

  # #15's Gate: image encoding takes at most 75 ms of wall time per output
  # on ubuntu-latest.
  image-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      - run: sudo apt-get install -y nasm
      - run: cargo nextest run --release --locked -p yuanme-assets --run-ignored only --no-capture

  # The Org parser's guarantees (#15): no input panics or fails except by
  # running out of fuel or nesting too deep, and none parses slower than
  # 1 ms/KB + 1 ms, scaled to the runner's speed. libFuzzer's
  # instrumentation slows parsing down, so the replay times the inputs found
  # again in a plain release build.
  fuzz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/organic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vendor/organic/fuzz
      - run: cargo install --locked cargo-fuzz@0.13.2
      # The fuzz crate is its own workspace, so the lint job doesn't see it.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/adversarial fuzz/corpus/bytes
          cargo fuzz run --sanitizer none adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial -- -max_total_time=120 -timeout=10
          cargo fuzz run --sanitizer none bytes fuzz/corpus/bytes fuzz/seeds/bytes -- -max_total_time=60 -timeout=10
      - name: Replay against the parse-time bound
        run: |
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- bytes fuzz/corpus/bytes fuzz/seeds/bytes
      # The inputs this run found, so a failure can be reproduced.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: |
            vendor/organic/fuzz/corpus
            vendor/organic/fuzz/artifacts
          if-no-files-found: ignore

  # The same guarantees for a Markdown body (#15, #47): no input panics, and
  # none parses slower than 1 ms/KB + 1 ms, scaled to the runner's speed,
  # through all of markdown::document. The bytes target starts from the
  # Markdown corpus, and the margin check fails if a corpus file has less
  # than ten times the fuel it needs.
  fuzz-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo run --release --locked --manifest-path fuzz/Cargo.toml --example margin -- corpus/md
      # The adversarial seeds are full-size slow inputs for the replay;
      # libFuzzer mutates their first 4 KB, which the generator multiplies.
      - name: Fuzz
        run: |
          mkdir -p fuzz/corpus/adversarial fuzz/corpus/bytes
          cargo fuzz run --sanitizer none adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial -- -max_total_time=120 -timeout=10 -max_len=4096
          cargo fuzz run --sanitizer none bytes fuzz/corpus/bytes corpus/md -- -max_total_time=60 -timeout=10
      - name: Replay against the parse-time bound
        run: |
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- adversarial fuzz/corpus/adversarial fuzz/seeds/adversarial
          cargo run --release --locked --manifest-path fuzz/Cargo.toml --example replay -- bytes fuzz/corpus/bytes corpus/md
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-markdown-corpus
          path: |
            fuzz/corpus
            fuzz/artifacts
          if-no-files-found: ignore

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check
      - run: cargo xtask vendor-check
      - name: deny.toml rejects a GPL crate
        run: |
          if cargo deny --manifest-path ci/deny-fixture/Cargo.toml --locked --config deny.toml check licenses 2> deny.out; then
            echo "::error::cargo-deny accepted ci/deny-fixture's GPL crate"; exit 1
          fi
          grep -q 'error\[rejected\]' deny.out || { cat deny.out; echo "::error::cargo-deny failed for another reason"; exit 1; }
      - run: cargo xtask package-check
