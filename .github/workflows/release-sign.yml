# sha256.txt, the hash of every release archive, and its minisign signature,
# sha256.txt.minisig, which `yuanme self update` checks (#37). They are
# uploaded as `artifacts-*`, so dist puts them in the GitHub Release.
name: Release signature

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: artifacts
          merge-multiple: true
      - run: sudo apt-get install -y minisign
      - name: Write sha256.txt
        working-directory: artifacts
        run: |
          count=$(ls yuanme-*.tar.xz yuanme-*.zip | wc -l)
          [ "$count" = 6 ] || { echo "::error::expected 6 archives, found $count"; exit 1; }
          for sum in yuanme-*.sha256; do sha256sum -c "$sum"; done
          sha256sum yuanme-*.tar.xz yuanme-*.zip > ../sha256.txt
          cat ../sha256.txt
      # A real release signs with the release key, and checks the signature
      # against the public key in the repository. A dry run signs with a key
      # made here and thrown away, so the steps still run.
      - name: Sign
        env:
          # The release's dispatch input: `dry-run`, or the tag to make.
          TAG: ${{ github.event.inputs.tag }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          if [ "$TAG" != dry-run ]; then
            [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::the MINISIGN_SECRET_KEY secret isn't set"; exit 1; }
            [ -f crates/yuanme/src/minisign.pub ] || { echo "::error::crates/yuanme/src/minisign.pub isn't committed"; exit 1; }
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
            public=crates/yuanme/src/minisign.pub
          else
            TAG=dry-run
            public="$RUNNER_TEMP/minisign.pub"
            minisign -G -W -p "$public" -s "$key"
          fi
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m sha256.txt -t "yuanme $TAG"
          rm "$key"
          minisign -V -p "$public" -m sha256.txt
          mkdir "$RUNNER_TEMP/public"
          cp "$public" "$RUNNER_TEMP/public/minisign.pub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-sha256-txt
          path: |
            sha256.txt
            sha256.txt.minisig
      # The key that verifies a dry run's signature; not part of a release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minisign-public-key
          path: ${{ runner.temp }}/public
