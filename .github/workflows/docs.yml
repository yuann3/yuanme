# Deploys the docs site (#38, #72) to Cloudflare Workers: the latest
# release's at /, and main's at /next/, as site/assemble.ts writes them. A
# push to main deploys it, and so does a release, once its GitHub Release
# exists (dist-workspace.toml's publish-jobs). The CI job `starters` checks
# the same Site in a browser. Without the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets it deploys nothing.
name: Docs

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      # dist's release plan, which this doesn't read: it deploys the
      # latest release, which is the one that called it.
      plan:
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  secrets:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - id: look
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, so the docs site isn't deployed."
          fi

  deploy:
    needs: secrets
    if: needs.secrets.outputs.found == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time; each deploys both Sites, so the newest wins.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rav1e's x86_64 assembly (#27).
      - run: sudo apt-get install -y nasm
      # Each Site is built by the yuanme of its own commit (#38).
      - name: Build main's yuanme
        run: |
          cargo build --locked -p yuanme
          cp target/debug/yuanme "$RUNNER_TEMP/yuanme-main"
      - name: Build the latest release's yuanme
        id: release
        run: |
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null); then
            echo "::notice::No release yet, so main is at / too."
            echo "site=site" >> "$GITHUB_OUTPUT"
            echo "yuanme=$RUNNER_TEMP/yuanme-main" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          git worktree add .worktrees/release "$tag"
          (cd .worktrees/release && cargo build --locked -p yuanme --target-dir ../../target)
          cp target/debug/yuanme "$RUNNER_TEMP/yuanme-release"
          echo "site=.worktrees/release/site" >> "$GITHUB_OUTPUT"
          echo "yuanme=$RUNNER_TEMP/yuanme-release" >> "$GITHUB_OUTPUT"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the docs site
        env:
          SITE: ${{ steps.release.outputs.site }}
          YUANME: ${{ steps.release.outputs.yuanme }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node site/assemble.ts --out site/dist \
            --root "$SITE" --root-yuanme "$YUANME" --version "$VERSION" \
            --next site --next-yuanme "$RUNNER_TEMP/yuanme-main"
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
      - env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          url=$(sed -n 's/^url = "\(.*\)"$/\1/p' site/yuanme.toml)
          echo "Deployed $VERSION at $url/ and main at $url/next/" >> "$GITHUB_STEP_SUMMARY"
